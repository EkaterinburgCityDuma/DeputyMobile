name: Deploy

on:
  push:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SERVER_IP: 5.165.226.209

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: "Mobile/PWA env"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        env:
          EXPO_PUBLIC_GEOCODER_API_KEY: ${{ secrets.EXPO_PUBLIC_GEOCODER_API_KEY }}
        run: |
          # if [ -z "$EXPO_PUBLIC_GEOCODER_API_KEY" ]; then
          #   echo "::error::EXPO_PUBLIC_GEOCODER_API_KEY is missing. Check the job environment and its secrets."
          #   exit 1
          # fi
          docker build \
            --build-arg EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }} \
            --build-arg EXPO_PUBLIC_GEOCODER_API_KEY="$EXPO_PUBLIC_GEOCODER_API_KEY" \
            --build-arg EXPO_PUBLIC_YAMAP_API_KEY=${{ secrets.EXPO_PUBLIC_YAMAP_API_KEY }} \
            --build-arg EXPO_PUBLIC_X_APP_SECRET=${{ secrets.EXPO_PUBLIC_X_APP_SECRET }} \
            -t ${{ secrets.DOCKER_USERNAME }}/deputy-pwa:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/deputy-pwa:latest

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_IP }}
          username: ddcroot
          password: ${{ secrets.SSH_PASSWORD }}
          #key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.frontend-pwa.yml"
          target: "/home/ddcroot/DeputyApp"
          strip_components: 0

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_IP }}
          username: ddcroot
          password: ${{ secrets.SSH_PASSWORD }}
          #key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ddcroot/DeputyApp
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker compose -f docker-compose.frontend-pwa.yml pull
            docker compose -f docker-compose.frontend-pwa.yml up -d
            docker image prune -f
            docker exec nginx-proxy nginx -s reload
